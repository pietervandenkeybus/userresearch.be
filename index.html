<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Session de recherche — Accès</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --iw-blue: #133DBD; --iw-blue-700: #0F32A0; --iw-blue-l: #EBF0FC; --iw-blue-xl: #F6F9FE;
  --iw-green: #65D78D;
  --iw-navy: #1B3353;
  --iw-gray: #8A9BB5; --iw-gray-d: #5A6D8A;
  --iw-border: #D6DFF0; --iw-border-l: #E6ECF5;
  --iw-surface: #F4F6FB;
  --err: #C2410C; --err-bg: #FFF1EA;
  --font-sans: 'Manrope', Arial, system-ui, sans-serif;
}
html, body { min-height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--iw-surface);
  color: var(--iw-navy);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  min-height: 100vh;
}
.topbar { height: 6px; background: var(--iw-blue); }
.wrap {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 32px 20px;
}
.card {
  width: 100%; max-width: 420px;
  background: white;
  border: 1px solid var(--iw-border);
  border-radius: 20px;
  box-shadow: 0 12px 40px -16px rgba(27,51,83,0.14);
  padding: 40px 36px 36px;
  text-align: center;
}
.illus { display: flex; justify-content: center; margin-bottom: 22px; }
.eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--iw-gray);
  margin-bottom: 10px;
}
h1 {
  font-size: 21px; font-weight: 800; letter-spacing: -0.015em;
  margin-bottom: 8px;
}
.sub {
  font-size: 13.5px; color: var(--iw-gray-d); line-height: 1.55;
  margin-bottom: 28px;
}
.field { text-align: left; margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 13px; font-weight: 600; color: var(--iw-navy);
  margin-bottom: 8px;
}
.field input {
  width: 100%;
  padding: 13px 14px;
  font-family: inherit; font-size: 15px; font-weight: 600;
  color: var(--iw-navy);
  background: var(--iw-surface);
  border: 1px solid var(--iw-border);
  border-radius: 8px;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.field input:focus { border-color: var(--iw-blue); background: white; }
.field input.invalid { border-color: var(--err); background: var(--err-bg); }
.error {
  display: none;
  font-size: 12.5px; font-weight: 600; color: var(--err);
  text-align: left;
  margin: -4px 0 14px;
}
.error.show { display: block; }
button {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 14px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  color: white; background: var(--iw-blue);
  border: none; border-radius: 8px; cursor: pointer;
  box-shadow: 0 8px 22px -8px rgba(19,61,189,0.45);
  transition: background 0.15s;
}
button:hover { background: var(--iw-blue-700); }
button:disabled { opacity: 0.6; cursor: wait; }
.foot {
  padding: 20px;
  text-align: center;
  font-size: 11.5px; color: var(--iw-gray);
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--iw-blue); outline-offset: 2px; }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">
  <main class="card">
    <div class="illus" aria-hidden="true">
      <svg viewBox="0 0 96 80" width="96" height="80" fill="none">
        <rect x="14" y="14" width="68" height="48" rx="6" fill="#EAF1FF" stroke="#C9D7F2" stroke-width="1.5"></rect>
        <rect x="24" y="24" width="36" height="5" rx="2.5" fill="#C9D7F2"></rect>
        <rect x="24" y="34" width="48" height="4" rx="2" fill="#DCE6F7"></rect>
        <rect x="24" y="43" width="28" height="4" rx="2" fill="#DCE6F7"></rect>
        <circle cx="68" cy="54" r="15" fill="#FFFFFF" stroke="#133DBD" stroke-width="2"></circle>
        <rect x="62" y="51" width="12" height="9" rx="2" fill="none" stroke="#133DBD" stroke-width="2"></rect>
        <path d="M64.5 51v-2.5a3.5 3.5 0 0 1 7 0V51" fill="none" stroke="#133DBD" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    </div>
    <div class="eyebrow">Session de recherche</div>
    <h1>Ce prototype est protégé</h1>
    <p class="sub">Entrez le code d'accès fourni par votre modérateur pour continuer.</p>
    <div class="field">
      <label for="pw">Code d'accès</label>
      <input type="password" id="pw" autocomplete="off" autofocus>
    </div>
    <p class="error" id="err">Code d'accès incorrect. Vérifiez et réessayez.</p>
    <button id="go">
      Accéder au prototype
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </main>
</div>
<div class="foot">userresearch.be · accès réservé aux participants invités</div>

<script>
(function () {
  // SHA-256 of the access code. To change the code, run in any browser console:
  //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('newcode'))
  //     .then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('')))
  var HASH = 'a3bd2f60937bd0c9ea176a151e3349c54c4522dc2396afb6e9ee7d050ceda115';
  var TARGET = 'Landing.html';

  // Already authenticated this session? Skip the gate.
  try {
    if (sessionStorage.getItem('ur_ok') === '1') { location.replace(TARGET); return; }
  } catch (e) {}

  var input = document.getElementById('pw');
  var btn = document.getElementById('go');
  var err = document.getElementById('err');

  async function sha256hex(str) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  async function submit() {
    var val = input.value.trim();
    if (!val) { input.focus(); return; }
    btn.disabled = true;
    try {
      var h = await sha256hex(val);
      if (h === HASH) {
        sessionStorage.setItem('ur_ok', '1');
        location.replace(TARGET);
        return;
      }
    } catch (e) {}
    err.classList.add('show');
    input.classList.add('invalid');
    input.select();
    btn.disabled = false;
  }

  btn.addEventListener('click', submit);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  input.addEventListener('input', function () {
    err.classList.remove('show');
    input.classList.remove('invalid');
  });
})();
</script>
</body>
</html>
