<!-- ==========================================================================
     Desktop chrome. Deliberately OUTSIDE the mobile frame so it can never be
     mistaken for part of the Immoweb interface (see prompt: TESTING SUPPORT).
     ========================================================================== -->
<header class="deskbar">
  <span class="deskbar__label">Immoweb Owner Hub — prototype</span>
  <div class="deskbar__actions">
    <label class="deskbar__field">
      <span>Startscherm</span>
      <select id="test-jump"></select>
    </label>
    <button type="button" class="deskbar__btn" id="reset-btn">Prototype opnieuw starten</button>
  </div>
</header>

<main class="stage">
  <div class="device">
    <div class="device__notch" aria-hidden="true"></div>
    <!-- Every Immoweb screen is rendered into here by screens.js -->
    <div class="device__screen" id="screen-root"></div>
    <div class="device__homebar" aria-hidden="true"></div>
  </div>
</main>

<p class="deskfoot">
  Alle schattingen, accountgegevens en woninggegevens zijn gesimuleerd.
  Er wordt niets verstuurd of extern opgeslagen.
</p>

<div class="sr-only" aria-live="polite" id="live"></div>

<script src="ui.js"></script>
<script src="data.js"></script>
<script src="screens.js"></script>
<script src="app.js"></script>
</body>
</html>
