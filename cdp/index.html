<script>
(function () {
  const phone = document.getElementById('phone'), toastEl = document.getElementById('toast');
  let timer = null, autoTimer = null;
  const pos = {}; let from = 'hub';
  function show(name) {
    clearTimeout(autoTimer);
    const prev = phone.querySelector('.screen.on'), psc = prev && prev.querySelector('.scroll');
    if (psc) pos[prev.dataset.screen] = psc.scrollTop;
    const fromSub = prev && prev.dataset.screen !== 'hub' && prev.dataset.screen !== 'detail';
    if (name === 'back') name = from;
    if (name === 'viewer' && prev) from = prev.dataset.screen;
    phone.querySelectorAll('.screen').forEach(s => { s.classList.toggle('on', s.dataset.screen === name); });
    const s = phone.querySelector('.screen.on'), sc = s.querySelector('.scroll');
    if (sc) sc.scrollTop = ((name === 'detail' || name === 'hub') && fromSub) ? (pos[name] || 0) : 0;
    if (typeof drawOverlays === 'function') drawOverlays();
    if (s.dataset.auto) autoTimer = setTimeout(() => show(s.dataset.auto), +s.dataset.delay || 1500);
    if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  }
  function toast(t) {
    toastEl.textContent = t; toastEl.hidden = false;
    clearTimeout(timer); timer = setTimeout(() => { toastEl.hidden = true; }, 3000);
  }
  const SCPT = () => document.querySelector('.screen[data-screen="detail"] .design').offsetHeight / (7822 / (632 / 425));
  phone.addEventListener('click', e => {
    const el = e.target.closest('[data-go], [data-toast], [data-scroll]'); if (!el) return;
    if (el.dataset.scroll) { el.closest('.scroll').scrollTo({ top: (+el.dataset.scroll * SCPT()) - 12, behavior: 'smooth' }); return; }
    if (el.dataset.toast) toast(el.dataset.toast);
    if (el.dataset.go) show(el.dataset.go);
  });
  // Swipe up on the docked card opens the full detail; swipe down at the top of the detail returns.
  const dock = document.getElementById('dock'), detail = phone.querySelector('.screen[data-screen="detail"]');
  let y0 = null;
  dock.addEventListener('pointerdown', e => { y0 = e.clientY; });
  dock.addEventListener('pointermove', e => { if (y0 !== null && y0 - e.clientY > 24) { y0 = null; openDetail(); } });
  dock.addEventListener('pointerup', () => { y0 = null; });
  dock.addEventListener('pointercancel', () => { y0 = null; });
  let ty0 = null;
  dock.addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; }, { passive: true });
  dock.addEventListener('touchmove', e => { if (ty0 !== null && ty0 - e.touches[0].clientY > 24) { ty0 = null; openDetail(); } }, { passive: true });
  dock.addEventListener('wheel', e => { if (e.deltaY > 12) openDetail(); }, { passive: true });
  function openDetail() { detail.classList.add('rise'); show('detail'); setTimeout(() => detail.classList.remove('rise'), 350); }
  const dsc = detail.querySelector('.scroll'); let dy0 = null;
  dsc.addEventListener('touchstart', e => { dy0 = dsc.scrollTop === 0 ? e.touches[0].clientY : null; }, { passive: true });
  dsc.addEventListener('touchmove', e => { if (dy0 !== null && e.touches[0].clientY - dy0 > 90) { dy0 = null; show('hub'); } }, { passive: true });
  dsc.addEventListener('wheel', e => { if (dsc.scrollTop === 0 && e.deltaY < -40) show('hub'); }, { passive: true });
  // language: ?lang=nl or ?lang=fr draws translated text over the design; en shows the design as is
  const lang = (new URLSearchParams(location.search).get('lang') || 'en').slice(0, 2);
  document.documentElement.lang = lang;
  const BTXT = { Call: { nl: 'Bellen', fr: 'Appeler' }, 'Book a visit': { nl: 'Bezoek aanvragen', fr: 'Demander une visite' }, New: { nl: 'Nieuw', fr: 'Nouveau' }, 'Under option': { nl: 'Onder optie', fr: 'Sous option' } };
  document.querySelectorAll('[data-t]').forEach(e => { const v = BTXT[e.dataset.t] && BTXT[e.dataset.t][lang]; if (v) { const sp = e.querySelector('span') || e; sp.textContent = v; } });
  if (lang !== 'en') document.querySelectorAll('.btns').forEach(b => b.classList.add('sm'));
  function drawOverlays() {
    document.querySelectorAll('.ov').forEach(o => {
      if (!o.clientWidth) return;
      const items = OV[o.dataset.ov] || [];
      if (lang === 'en') { o.innerHTML = ''; return; }
      const u = o.clientWidth / +o.dataset.w; o.style.setProperty('--u', u + 'px');
      o.innerHTML = items.map(i => '<div class="' + (i.a === 'center' ? 'c' : i.a === 'right' ? 'r' : '') + (i.lh ? ' p' : '') + (i.pill ? ' pill' + (i.fs === 13 ? ' l' : '') : '') + '" style="left:' + i.l + '%;top:' + i.t + '%;width:' + i.w + '%;height:' + i.h + '%;font-size:' + (i.fs * u).toFixed(2) + 'px;font-weight:' + i.fw + ';color:' + i.c + ';background:' + i.bg + (i.lh ? ';line-height:' + (i.lh * u).toFixed(2) + 'px' : '') + '">' + (i[lang] || i.nl) + '</div>').join('');
    });
  }
  drawOverlays(); window.addEventListener('resize', drawOverlays);
  document.querySelectorAll('.ov').forEach(o => { const img = o.previousElementSibling; if (img && img.tagName === 'IMG' && !img.complete) img.addEventListener('load', drawOverlays); });
  // ?debug shows the tap areas
  if (location.search.indexOf('debug') >= 0) document.body.classList.add('debug');
  const h = location.hash.slice(1);
  if (h && phone.querySelector('.screen[data-screen="' + h + '"]')) show(h);
})();
</script>
</body>
</html>
