<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#133DBD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Immoweb">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Immoweb Search Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: one phone sized app. Sticky brand header, scrolling content, bottom sheets for every choice. */
:root {
  color-scheme: light;
  --navy: #082479;
  --blue: #133DBD;
  --blue-strong: #1542C9;
  --line-strong: #315ED1;
  --line: #A8BEEA;
  --line-soft: #DCE4F5;
  --text: #63697D;
  --surface: #F3F5FA;
  --white: #FFFFFF;
  --green: #65D78D;
  --green-soft: #E3F8EA;
  --orange: #E2530D;
  --orange-soft: #FCE9DF;
  --blue-soft: #E7EDFB;
  --danger: #B3261E;
  --stage: #DDE3F1;
  --bezel: #0A1B55;
  --font: "Gratimo Grotesk", "Lexend", Arial, "Trebuchet MS", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body {
  background: var(--stage);
  color: var(--text);
  font: 400 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 3px solid var(--line-strong); outline-offset: 2px; }
[hidden] { display: none !important; }

.stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 24px 16px; }
.phone {
  position: relative; flex: none;
  width: 390px; height: min(820px, calc(100dvh - 48px));
  background: var(--white);
  border: 10px solid var(--bezel); border-radius: 44px;
  overflow: hidden;
}
.aside { max-width: 260px; display: flex; flex-direction: column; gap: 12px; }
.aside h2 { margin: 0; color: var(--navy); font-size: 20px; line-height: 1.2; }
.aside p { margin: 0; font-size: 14px; }
.aside .btn { align-self: flex-start; }
@media (max-width: 760px) {
  .aside { display: none; }
}
@media (max-width: 520px) {
  .stage { padding: 0; display: block; height: 100%; }
  .phone { width: 100%; height: 100%; border: 0; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); }
}

.app { height: 100%; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.pad { padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 16px; }

/* Header */
.top { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 8px 12px 8px 20px; border-bottom: 1px solid var(--line-soft); background: var(--white); }
.logo { display: inline-flex; align-items: center; color: var(--blue); font-weight: 700; font-size: 25px; letter-spacing: -0.02em; line-height: 1; }
.logo svg { width: 19px; height: 19px; margin: 3px 1px 0; }
.top-actions { display: flex; align-items: center; gap: 4px; }
.icon-btn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; color: var(--blue); border-radius: 50%; }
.icon-btn svg { width: 24px; height: 24px; }
.badge { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--orange); color: var(--white); font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.backbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid var(--line-soft); }
.back { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 8px 0 0; color: var(--blue); font-weight: 700; font-size: 14px; }
.back svg { width: 22px; height: 22px; }

/* Type */
h1 { margin: 0; color: var(--navy); font-size: 20px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
h2 { margin: 0; color: var(--navy); font-size: 16px; line-height: 1.25; font-weight: 700; }
p { margin: 0; }
.lead { font-size: 16px; }
.small { font-size: 14px; }
.fine { font-size: 13px; line-height: 1.45; }
.count { color: var(--text); font-weight: 400; }
b, strong { font-weight: 700; color: var(--navy); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 20px; border-radius: 22px; font-weight: 700; font-size: 16px; line-height: 1.2; text-align: center; border: 1px solid transparent; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--navy); }
.btn.tertiary { background: var(--white); border-color: var(--line-strong); color: var(--blue); }
.btn.small { min-height: 36px; padding: 6px 14px; font-size: 14px; border-radius: 18px; }
.btn.block { width: 100%; }
.btn.danger { background: var(--white); border-color: var(--danger); color: var(--danger); }
.link { color: var(--blue); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* Listing card, after the Immoweb result card */
.cards { display: flex; flex-direction: column; gap: 16px; }
.card { position: relative; border: 1px solid var(--line); border-radius: 4px; background: var(--white); overflow: hidden; }
.card-main { display: block; width: 100%; }
.media { position: relative; display: block; aspect-ratio: 16 / 10; background: var(--surface); overflow: hidden; }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.flags { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.flag { display: inline-block; padding: 1px 6px; border-radius: 2px; background: var(--blue-strong); color: var(--white); font-size: 11px; font-weight: 700; line-height: 16.5px; text-transform: uppercase; letter-spacing: 0.02em; }
.flag-new { background: var(--orange); }
.flag-match { background: var(--green); color: var(--navy); }
.heart { position: absolute; right: 8px; top: 8px; z-index: 1; width: 38px; height: 38px; border-radius: 50%; background: rgba(8, 36, 121, 0.82); color: var(--white); display: grid; place-items: center; }
.heart svg { width: 19px; height: 19px; }
.saver { position: absolute; right: 52px; top: 11px; z-index: 1; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 4px; border-radius: 16px; background: rgba(255, 255, 255, 0.94); color: var(--navy); font-size: 12px; font-weight: 700; }
.vline .link { margin-left: auto; flex: none; font-size: 13px; }
.vline > span { min-width: 0; }
.peb { position: absolute; left: 8px; bottom: 8px; padding: 1px 14px 1px 8px; font-size: 12px; font-weight: 700; line-height: 18px; color: var(--white); clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); }
.peb-A { background: #1E9B4B; } .peb-B { background: #6FB23A; } .peb-C { background: #B5C400; color: var(--navy); }
.peb-D { background: #F2C500; color: var(--navy); } .peb-E { background: #F09A00; color: var(--navy); } .peb-F { background: #E2530D; }
.body { display: block; padding: 12px 14px 12px; }
.body > span { display: block; }
.type { font-weight: 700; font-size: 16px; line-height: 1.3; }
.price { color: var(--navy); font-weight: 700; font-size: 20px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.facts, .loc { font-size: 15px; line-height: 1.4; }
.by { margin-top: 6px; font-size: 13px; }

/* Collaboration row on a card */
.collab { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line-soft); }
.rx-pair { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rx { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 4px; border-radius: 17px; background: var(--surface); font-size: 13px; color: var(--text); }
.rx .emo { font-size: 18px; line-height: 1; }
button.rx { border: 1px solid var(--line); background: var(--white); }
.rx-todo { border: 1px dashed var(--line-strong) !important; color: var(--blue); font-weight: 700; }
.av { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--white); line-height: 1; }
.av-me { background: var(--blue); font-size: 9.5px; letter-spacing: -0.02em; }
.av-me.av-lg { font-size: 13px; }
.av-partner { background: var(--orange); }
.av-lg { width: 40px; height: 40px; font-size: 15px; border: 2px solid var(--white); }
.av-empty { background: var(--white); border: 2px dashed var(--line) !important; color: var(--line-strong); }
.cmt { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; color: var(--blue); font-weight: 700; font-size: 14px; }
.cmt svg { width: 20px; height: 20px; }
.vline { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 14px; border-top: 1px solid var(--line-soft); font-size: 14px; line-height: 1.3; color: var(--navy); }
.vline svg { width: 18px; height: 18px; flex: none; color: var(--blue); }
.vline.todo { background: var(--orange-soft); font-weight: 700; }
.vline.todo svg { color: var(--orange); }
.vline.ok { background: var(--green-soft); }
.vline.wait { background: var(--surface); color: var(--text); }

/* Banners */
.banner { background: var(--surface); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.banner .pair { display: flex; }
.banner .pair .av + .av { margin-left: -6px; }
.proto { width: 100%; padding: 10px 12px; border: 2px dashed #7A2E8E; border-radius: 4px; color: #4A1A59; font-size: 12px; font-weight: 700; text-align: center; background: #F6E9FA; font-family: ui-monospace, Menlo, Consolas, monospace; }
.proto::before { content: 'TEST '; color: #7A2E8E; }
.proto-note { font-size: 12px; text-align: center; color: var(--text); }

/* Hub */
.hub-head { padding: 16px 20px 12px; display: flex; align-items: center; gap: 12px; }
.hub-head .pair { display: flex; flex: none; }
.hub-head .pair .av + .av { margin-left: -6px; }
.hub-head .txt { flex: 1; min-width: 0; }
.hub-head .txt p { font-size: 14px; }
.tabs { position: sticky; top: 0; z-index: 2; display: flex; background: var(--white); border-bottom: 1px solid var(--line-soft); padding: 0 12px; }
.tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 46px; font-weight: 700; font-size: 15px; color: var(--text); border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); }
.tab .dot { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--orange); color: var(--white); font-size: 11px; line-height: 18px; text-align: center; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line-strong); color: var(--blue); font-weight: 700; font-size: 14px; background: var(--white); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--white); }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.empty { padding: 28px 16px; text-align: center; background: var(--surface); border-radius: 8px; font-size: 14px; }

/* Activity feed */
.feed { display: flex; flex-direction: column; }
.item { position: relative; display: flex; gap: 12px; width: 100%; padding: 12px 20px; border-bottom: 1px solid var(--line-soft); align-items: flex-start; }
.item.unread { background: var(--blue-soft); }
.item .av { margin-top: 2px; }
.item .txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; }
.item .txt .quote { display: block; margin-top: 2px; color: var(--text); }
.item .when { display: block; margin-top: 2px; font-size: 12px; }
.thumb { position: relative; flex: none; width: 56px; height: 44px; border-radius: 4px; overflow: hidden; background: var(--surface); }
.av-both { background: var(--green); color: var(--navy); }
.av-both svg { width: 14px; height: 14px; }

/* Visits */
.mini { display: flex; gap: 12px; align-items: center; width: 100%; }
.mini .thumb { width: 72px; height: 56px; }
.mini .txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
.mini .txt .price { font-size: 16px; }
.vcard { border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.slots { display: flex; flex-direction: column; gap: 8px; }
.slot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 12px; border-radius: 8px; background: var(--surface); font-size: 15px; color: var(--navy); font-weight: 500; }
.when-row { display: flex; align-items: center; gap: 10px; color: var(--navy); font-weight: 700; font-size: 15px; }
.when-row svg { width: 20px; height: 20px; color: var(--blue); flex: none; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Detail */
.detail { position: relative; }
.detail .media { aspect-ratio: 16 / 11; }
.about { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
.about dt { color: var(--text); }
.about dd { margin: 0; color: var(--navy); font-weight: 500; }
.detail-body { padding: 14px 20px 28px; display: flex; flex-direction: column; gap: 22px; }
.detail-body .price { font-size: 24px; }
.rx-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rx-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); font-size: 12px; line-height: 1.2; color: var(--text); text-align: center; }
.rx-opt .emo { font-size: 26px; line-height: 1; }
.rx-opt[aria-pressed="true"] { border: 2px solid var(--blue); padding: 9px 1px 7px; background: var(--blue-soft); color: var(--navy); font-weight: 700; }
.their { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--blue-soft); color: var(--navy); font-weight: 700; font-size: 13px; }
.thread { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
.msg .bubble { padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: var(--surface); font-size: 14.5px; line-height: 1.4; color: var(--navy); }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg.me .bubble { background: var(--blue); color: var(--white); border-radius: 14px 14px 4px 14px; }
.typing { font-size: 13px; padding-left: 34px; }
.composer { flex: none; display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line-soft); background: var(--white); }
.composer input { flex: 1; min-width: 0; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--white); color: var(--navy); font-size: 16px; }
.composer input::placeholder, .field input::placeholder { color: #8A90A2; }
.composer button[type="submit"] { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--green); color: var(--navy); display: grid; place-items: center; }
.composer button[type="submit"] svg { width: 20px; height: 20px; }

/* Forms */
.benefits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.benefits li { display: flex; gap: 12px; align-items: flex-start; }
.benefits .ico { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; }
.benefits .ico svg { width: 19px; height: 19px; }
.benefits b { display: block; font-size: 15px; line-height: 1.3; }
.benefits span { font-size: 14px; line-height: 1.4; }
form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, legend { font-weight: 700; font-size: 14px; color: var(--navy); padding: 0; }
.field input { height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--white); color: var(--navy); font-size: 16px; }
.field input:focus, .composer input:focus { outline: 2px solid var(--line-strong); outline-offset: 0; border-color: var(--line-strong); }
.err { color: var(--danger); font-size: 14px; font-weight: 500; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt input { flex: none; width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--blue); }
.opt .t { display: block; color: var(--navy); font-weight: 500; font-size: 15px; line-height: 1.35; }
.opt .s { display: block; font-size: 13px; line-height: 1.4; }
.opt:has(input:checked) { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); background: var(--blue-soft); }
.picklist { display: flex; flex-direction: column; gap: 6px; padding-left: 6px; }
.picktools { display: flex; flex-direction: column; gap: 8px; }
.picktools input { height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); font-size: 15px; color: var(--navy); }
.picktools .chips { padding: 0; margin: 0; }
.picktools .chip { height: 32px; font-size: 13px; }
.pickcount { font-size: 13px; }
.picklist label { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--navy); min-height: 32px; }
.picklist label input { width: 18px; height: 18px; accent-color: var(--blue); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; color: var(--navy); font-size: 15px; cursor: pointer; }
.toggle-row input { flex: none; appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; margin: 0; cursor: pointer; transition: background 0.15s; }
.toggle-row input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--white); transition: transform 0.15s; }
.toggle-row input:checked { background: var(--blue); }
.toggle-row input:checked::after { transform: translateX(18px); }

/* Sheets */
.backdrop { position: absolute; inset: 0; z-index: 10; background: rgba(8, 36, 121, 0.45); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 88%; overflow-y: auto; background: var(--white); border-radius: 16px 16px 0 0; padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet.enter { animation: rise 0.22s ease-out; }
.backdrop.enter { animation: fade 0.22s ease-out; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.grab { align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line); flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 18px; }
.radio-list { display: flex; flex-direction: column; }
.radio { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line-soft); color: var(--navy); font-size: 16px; width: 100%; }
.radio:last-child { border-bottom: 0; }
.radio .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.radio[aria-checked="true"] { font-weight: 700; }
.radio[aria-checked="true"] .mark { border-color: var(--blue); }
.radio[aria-checked="true"] .mark::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--navy); font-size: 15px; font-weight: 500; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--blue); margin: 0; }
.check:has(input:checked) { border-color: var(--blue); background: var(--blue-soft); }
.menu-list { display: flex; flex-direction: column; }
.menu-list button svg { width: 20px; height: 20px; flex: none; color: var(--blue); }
.menu-list button { min-height: 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line-soft); color: var(--navy); font-size: 16px; font-weight: 500; width: 100%; }
.person { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--line-soft); }
.person .txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
.person .txt b { display: block; font-size: 15px; }

/* App tab bar: floating pill with five items, after the Immoweb app */
.tabbar { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; padding: 5px; border-radius: 34px; background: var(--white); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(8, 36, 121, 0.16); }

.scroll.tabbed { padding-bottom: 84px; }
.btn.blue { background: var(--blue); border-color: var(--blue); color: var(--white); }

.promo p { font-size: 14px; }

.group { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.group .rowlink { border: 0; border-radius: 0; padding: 14px 16px; }
.group .rowlink + .rowlink { border-top: 1px solid var(--line-soft); }
.big { font-size: 22px; }

/* Saved: switch between my saved properties and the shared list */
.segbar { flex: none; padding: 12px 20px; border-bottom: 1px solid var(--line-soft); background: var(--white); }

.segsw button[aria-selected="true"] { background: var(--blue); color: var(--white); }
.segsw .dot { flex: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--orange); color: var(--white); font-size: 11px; line-height: 18px; text-align: center; }
.segsw .n { flex: none; font-weight: 400; }

.searchbox.line { border: 1px solid var(--line); color: var(--navy); height: 48px; }

/* Home */
.hero { background: var(--blue); padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.hero h1 { color: var(--white); font-size: 24px; }
.seg { display: inline-flex; align-self: flex-start; padding: 3px; border-radius: 20px; background: rgba(255, 255, 255, 0.18); }
.seg button { height: 34px; padding: 0 16px; border-radius: 17px; color: var(--white); font-weight: 700; font-size: 14px; }

.rowlink .txt { flex: 1; min-width: 0; }

.rowlink > svg { flex: none; width: 20px; height: 20px; color: var(--blue); }

.tcard-head > svg { flex: none; width: 20px; height: 20px; color: var(--blue); }
.tcard .item { padding: 12px 14px; }

.hscroll { display: flex; gap: 12px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 4px; scrollbar-width: none; }

.scard .price { font-size: 16px; }

<body>

  <div class="phone" id="phone">
    <div class="app" id="app"></div>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
  <aside class="aside">
    <h2>Search together</h2>
    <p>Concept prototype for user research. Sample data only. Nothing is sent or saved.</p>
    <button class="btn tertiary small" data-act="restart">Restart from the beginning</button>
    <button class="btn tertiary small" data-act="jump">Jump to the shared list</button>
    <p>On a phone, both shortcuts are in the Profile tab.</p>

</div>

/* ---------- translation (applied to the rendered DOM) ---------- */
const RULES = LANG === 'en' ? [] : (window.HUB_I18N || []).map(r => {

  const m = text.match(/^(\s*)(.*?)(\s*)$/), core = m[2]; if (!core) return text;

    for (const r of PATS) { const mm = core.match(r.re); if (mm) { out = r.d.replace(/\{(\d)\}/g, (_, i) => tr(mm[+i])); break; } }
  }
  return out === undefined ? text : m[1] + out + m[3];

  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { const t = tr(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; });
  root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e => { ['placeholder', 'aria-label', 'title'].forEach(a => { const v = e.getAttribute(a); if (v) e.setAttribute(a, tr(v)); }); });
}

  if (!st.partner) st.partner = 'Alex'; st.linkOnly = false;
  st.props.forEach(p => { if (p.saved) p.shared = st.pick ? st.pick.indexOf(p.id) >= 0 : true; });
  st.collab = 'active'; st.stack = [{ s: 'saved' }]; st.seg = 'shared'; st.tab = 'list'; st.filter = 'all'; st.sheet = null; scrolls = {};
  render();
  if (!silent) toast(pn() + ' joined. This is your shared list.');
}
function shareProp(p, announce) {
  p.shared = true; p.sharedAt = ++st.seq; p.by = p.by || 'me';
  log({ who: 'me', kind: 'shared', pid: p.id });
  if (announce) { render(); toast('Shared with ' + pn(), 'unshare', p.id, 'Undo'); }
  if (!p.partner && !p.simmed) { p.simmed = true; later(6500, () => partnerReacts(p)); }
}
function unshareProp(p) {
  p.shared = false; render(); toast('Only you can see this one now', 'share', p.id, 'Undo');
}
function partnerReacts(p) {
  if (!p.shared || p.partner || !isActive()) return;
  const k = (st.sim++ % 2 === 0) ? 'love' : 'like';
  p.partner = k;
  log({ who: 'partner', kind: 'react', pid: p.id, r: k, unread: true });
  render(); toast(pn() + ' reacted ' + R[k].e + ' to ' + place(p), 'open', p.id);
}
function toggleSave(p) {
  if (p.saved) {
    p.wasShared = p.shared && p.by !== 'partner';
    p.saved = false; if (p.wasShared) p.shared = false;
    render(); toast('Removed from your saves', 'undo-save', p.id, 'Undo'); return;
  }
  if (isActive() && p.shared) { toast(pn() + ' saved this one, so only ' + pn() + ' can remove it.'); return; }
  if (isActive() && st.saveMode === 'ask') { openSheet('saveto', p.id); return; }
  doSave(p, isActive() && st.saveMode === 'auto');
}
function doSave(p, share) {
  p.saved = true; p.savedAt = ++st.seq; p.by = p.by || 'me'; p.ago = 'just now';
  if (share) { shareProp(p, false); render(); toast('Saved and shared with ' + pn(), 'unshare', p.id, 'Keep private'); }
  else if (isActive()) { render(); toast('Saved. Only you can see it.', 'share', p.id, 'Share'); }
  else { render(); toast('Saved to My saves'); }
}
function setReaction(p, k) {
  const was = isMatch(p);
  p.me = k; p.isNew = false;
  st.sheet = null; render();
  if (!was && isMatch(p)) { log({ who: 'both', kind: 'match', pid: p.id }); toast('You both like this one ' + R[k].e); render(); }
  else toast('Your reaction is shared with ' + pn());
}
function partnerPicks(p) {
  if (!p.visit || p.visit.state !== 'mine') return;
  const s = p.visit.slots[0];
  p.visit = { state: 'planned', slot: s, requested: false }; p.status = 'planned';
  log({ who: 'partner', kind: 'planned', pid: p.id, unread: true });
  render(); toast(pn() + ' picked ' + slotLabel(s), 'open', p.id);
}
function partnerReplies(p) {
  const lines = { zuid: 'Great. Shall I ask the agency for a visit this weekend?', mortsel: 'Fair point. Let us look at the roof quote together tonight.', borgerhout: 'Okay, I will take another look at the photos.' };
  st.typing = p.id; render({ bottom: cur().s === 'detail' && cur().id === p.id });
  later(2200, () => {
    st.typing = null;
    const t = lines[p.id] || 'Good point. Let us talk it through tonight.';
    p.comments.push({ by: 'partner', t: t });
    const here = cur().s === 'detail' && cur().id === p.id;
    log({ who: 'partner', kind: 'comment', pid: p.id, q: t, unread: !here });
    render({ bottom: here });
    if (!here) toast(pn() + ' replied on ' + place(p), 'open', p.id);
  });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v, p = id && prop(id);
  switch (a) {
    case 'home': st.sheet = null; st.stack = [{ s: 'home' }]; render({ top: true }); break;
    case 'nav': {
      const to = v === 'together' ? 'saved' : v;
      if (v === 'together') st.seg = 'shared'; else if (el.dataset.seg) st.seg = el.dataset.seg;
      const same = cur().s === to && st.stack.length === 1 && el.classList.contains('tb');
      st.sheet = null; st.stack = [{ s: to }]; render({ top: same }); break;
    }
    case 'seg': st.seg = v; render(); break;
    case 'deal': st.deal = v; render(); break;
    case 'oos-search': toast('Changing the search is not part of this prototype.'); break;
    case 'back': back(); break;
    case 'bell': st.sheet = null; st.stack = [{ s: 'saved' }]; st.seg = 'shared'; st.tab = 'activity'; scrolls[viewKey()] = 0; render(); break;
    case 'invite': go('invite'); break;
    case 'copy-link': {
      if ($('#share-pick')) readPick();
      const n = ($('#inv-name') || {}).value; st.partner = (n && n.trim()) || ''; st.linkOnly = !st.partner;
      if (st.collab !== 'active') st.collab = 'pending';
      render(); toast('Invite link copied. Send it to the person you search with.'); break;
    }
    case 'remind': toast('Reminder sent to ' + pn()); break;
    case 'cancel-invite': st.collab = 'none'; st.linkOnly = false; render(); toast('Invite cancelled'); break;
    case 'accept': activate(); break;
    case 'jump': epoch++; st = fresh(); $('#toast').hidden = true; activate(true); break;
    case 'restart': restart(); break;
    case 'tab': st.tab = v; scrolls[viewKey()] = 0; render(); break;
    case 'filter': st.filter = v; render(); break;
    case 'open':
      $('#toast').hidden = true;
      if (cur().s === 'detail' && cur().id === id) { st.sheet = null; render(); break; }
      if (cur().s === 'detail') st.stack.pop();
      go('detail', { id: id, anchor: el.classList.contains('cmt') ? 'comments' : null }); break;
    case 'react-sheet': openSheet('react', id); break;
    case 'react': setReaction(p, v); break;
    case 'status': openSheet('status', id); break;
    case 'set-status': {
      p.status = v; log({ who: 'me', kind: 'status', pid: p.id, q: STATUS[v] });
      st.sheet = null; render(); toast('Status changed to ' + STATUS[v]); break;
    }
    case 'propose': openSheet('propose', id); break;
    case 'pick': {
      const s = p.visit.slots[+v]; p.visit = { state: 'planned', slot: s, requested: false }; p.status = 'planned';
      log({ who: 'me', kind: 'planned', pid: p.id }); render(); toast('Visit planned for ' + slotLabel(s)); break;
    }
    case 'cancel-visit': p.visit = null; p.status = 'saved'; log({ who: 'me', kind: 'cancelled', pid: p.id }); render(); toast('Visit cancelled. ' + pn() + ' is notified.'); break;
    case 'request': p.visit.requested = true; render(); toast('Visit request sent to the agency'); break;
    case 'calendar': toast('Added to your calendar'); break;
    case 'visited': {
      p.visit = { state: 'visited', slot: { d: now, t: '' } }; p.status = 'visited';
      log({ who: 'me', kind: 'visited', pid: p.id }); render(); toast('Marked as visited'); break;
    }
    case 'feed': {
      const f = st.feed[+v]; f.unread = false;
      if (f.pid) go('detail', { id: f.pid, anchor: f.kind === 'comment' ? 'comments' : null }); else render(); break;
    }
    case 'read-all': st.feed.forEach(f => { f.unread = false; }); render(); break;
    case 'notif': openSheet('notif'); break;
    case 'manage': openSheet('manage'); break;
    case 'add-person': toast('In this prototype you search with one other person.'); break;
    case 'stop': st.sheet.confirm = true; render(); break;
    case 'stop-no': st.sheet.confirm = false; render(); break;
    case 'stop-yes': { const n = pn(); st.collab = 'none'; st.stack = [{ s: 'saved' }]; st.seg = 'shared'; st.sheet = null; scrolls = {}; render(); toast('You stopped sharing with ' + n); break; }
    case 'listing': toast('Contacting the agency is not part of this prototype.'); break;
    case 'save': toggleSave(p); break;
    case 'undo-save': p.saved = true; if (p.wasShared) p.shared = true; render(); toast('Saved again'); break;
    case 'share': shareProp(p, true); break;
    case 'unshare': unshareProp(p); break;
    case 'pick-type': document.querySelectorAll('#pick-chips .chip').forEach(c => c.setAttribute('aria-pressed', c === el)); filterPick(); break;
    case 'toggle-auto': st.saveMode = { ask: 'auto', auto: 'private', 'private': 'ask' }[st.saveMode]; render(); break;
    case 'save-to': {
      const rem = $('#save-remember');
      if (rem && rem.checked) st.saveMode = v === 'shared' ? 'auto' : 'private';
      st.sheet = null; doSave(p, v === 'shared'); break;
    }
    case 'oos': toast('This page is not part of this prototype.'); break;
    case 'close-sheet': closeSheet(); break;
  }
});

function filterPick() {
  const q = (($('#pick-q') || {}).value || '').toLowerCase().trim(), t = (document.querySelector('#pick-chips [aria-pressed="true"]') || {}).dataset;
  const type = t ? t.v : 'All'; let n = 0;
  document.querySelectorAll('#picklist label').forEach(l => { l.hidden = (type !== 'All' && l.dataset.type !== type) || (q && l.dataset.text.indexOf(q) < 0); if (l.querySelector('input').checked) n++; });
  const shown = document.querySelectorAll('#picklist label:not([hidden])').length;
  const c = $('#pick-count'); if (c) c.textContent = n + ' selected' + (shown ? '' : '. No saved properties match this filter.');
  if (c) c.textContent = tr(c.textContent);
}
document.addEventListener('input', e => { if (e.target.id === 'pick-q') filterPick(); });
document.addEventListener('change', e => {
  if (e.target.name === 'share') { const l = $('#picklist'); if (l) l.hidden = !$('#share-pick').checked; }
  if (e.target.closest('#picklist')) filterPick();
  if (e.target.name === 'slot') { const all = document.querySelectorAll('input[name=slot]'), n = document.querySelectorAll('input[name=slot]:checked').length; all.forEach(i => { i.disabled = !i.checked && n >= 3; i.closest('label').style.opacity = i.disabled ? '0.45' : ''; }); }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form, p = form.dataset.id && prop(form.dataset.id);
  if (kind === 'invite') {
    const email = $('#inv-email').value.trim(), name = $('#inv-name').value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { $('#inv-err').hidden = false; $('#inv-email').focus(); return; }
    readPick();
    st.partner = name || 'Alex'; st.linkOnly = false; st.collab = 'pending'; st.stack = [{ s: 'saved' }]; st.seg = 'shared'; scrolls = {};
    $('#app').innerHTML = ''; render(); toast('Invite sent to ' + pn());
  } else if (kind === 'comment') {
    const input = $('#comment-input'), t = input.value.trim(); if (!t) return;
    input.value = '';
    p.comments.push({ by: 'me', t: t }); p.isNew = false;
    render({ bottom: true });
    if (!p.replied) { p.replied = true; later(1400, () => partnerReplies(p)); }
  } else if (kind === 'propose') {
    const picked = Array.from(form.querySelectorAll('input[name=slot]:checked')).map(i => st.slotOpts[+i.value]);
    if (picked.length < 1 || picked.length > 3) { $('#slot-err').hidden = false; return; }
    p.visit = { state: 'mine', slots: picked };
    log({ who: 'me', kind: 'proposed', pid: p.id, n: picked.length });
    st.sheet = null; render(); toast('Sent to ' + pn() + '. You get a notification when they pick.');
    later(7000, () => partnerPicks(p));
  } else if (kind === 'notif') {
    ['saved', 'react', 'comment', 'visit'].forEach(k => { st.notif[k] = $('#nt-' + k).checked; });
    st.notif.channel = form.querySelector('input[name=channel]:checked').value;
    st.notif.when = form.querySelector('input[name=when]:checked').value;
    st.sheet = null; render(); toast('Notification settings saved');
  }
});

st = fresh();
render();
if (location.hash === '#shared') activate(true);
})();
</script>
</body>
